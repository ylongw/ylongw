name: Refresh profile cards

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh-profile-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate and validate public profile cards
        run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit refreshed cards and cache versions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(profile): refresh public SVG cards'
          git pull --rebase origin main
          git push origin HEAD:main
