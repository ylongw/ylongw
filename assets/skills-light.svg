<title id="title">What I&#x27;m working on + Tech Stack</title>
<desc id="desc">Embedded tooling, AI agent reliability, self-hosted infrastructure and camera workflows. C, C++, Python, Shell, Swift, STM32, GD32, FreeRTOS, CMake and J-Link.</desc>
<defs>
