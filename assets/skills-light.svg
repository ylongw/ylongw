<text x="36" y="38" class="muted mono" font-size="12" font-weight="500" letter-spacing="2">02 — ACTIVE CHANNELS</text><text x="36" y="83" class="ink sans" font-size="28" font-weight="700" >What I&#x27;m working on</text><text x="964" y="82" class="accent mono" font-size="11" font-weight="500" text-anchor="end">FOUR THREADS / ONE WORKBENCH</text><rect x="36" y="110" width="454" height="144" rx="12" class="panel" stroke="#c5dbd9"/><text x="54" y="142" class="accent mono" font-size="13" font-weight="500" >01</text><text x="88" y="142" class="ink sans" font-size="19" font-weight="650" >Embedded tooling</text><text x="54" y="173" class="muted sans" font-size="14" font-weight="400" >AI-assisted C/C++ review, J-Link flash/debug loops,</text><text x="54" y="195" class="muted sans" font-size="14" font-weight="400" >and STM32 framebuffer capture.</text><text x="54" y="231" class="accent mono" font-size="10" font-weight="500" letter-spacing="0.8">C / C++ · J-LINK · STM32</text><rect x="510" y="110" width="454" height="144" rx="12" class="panel" stroke="#c5dbd9"/><text x="528" y="142" class="accent mono" font-size="13" font-weight="500" >02</text><text x="562" y="142" class="ink sans" font-size="19" font-weight="650" >AI agent reliability</text><text x="528" y="173" class="muted sans" font-size="14" font-weight="400" >Investigating model routing, classifier fallbacks,</text><text x="528" y="195" class="muted sans" font-size="14" font-weight="400" >and quota freshness in Magpie.</text><text x="528" y="231" class="accent mono" font-size="10" font-weight="500" letter-spacing="0.8">MODEL ROUTING · AGENT TOOLS</text><rect x="36" y="272" width="454" height="144" rx="12" class="panel" stroke="#c5dbd9"/><text x="54" y="304" class="accent mono" font-size="13" font-weight="500" >03</text><text x="88" y="304" class="ink sans" font-size="19" font-weight="650" >Self-hosted infra</text><text x="54" y="335" class="muted sans" font-size="14" font-weight="400" >Ubuntu VPS deployment and Linux/fnOS</text><text x="54" y="357" class="muted sans" font-size="14" font-weight="400" >fan-control automation.</text><text x="54" y="393" class="accent mono" font-size="10" font-weight="500" letter-spacing="0.8">UBUNTU · LINUX / FNOS</text><rect x="510" y="272" width="454" height="144" rx="12" class="panel" stroke="#c5dbd9"/><text x="528" y="304" class="accent mono" font-size="13" font-weight="500" >04</text><text x="562" y="304" class="ink sans" font-size="19" font-weight="650" >Camera workflows</text><text x="528" y="335" class="muted sans" font-size="14" font-weight="400" >Organizing Sony uploads and turning Shot Mark</text><text x="528" y="357" class="muted sans" font-size="14" font-weight="400" >clips into Apple Live Photos.</text><text x="528" y="393" class="accent mono" font-size="10" font-weight="500" letter-spacing="0.8">SONY · MEDIA AUTOMATION</text><text x="36" y="460" class="muted mono" font-size="12" font-weight="500" letter-spacing="2">TECH STACK</text><rect x="36" y="479" width="30.2" height="29" rx="7" class="panel" /><text x="51.1" y="498" class="accent mono" font-size="13" font-weight="500" text-anchor="middle">C</text><rect x="74.2" y="479" width="46.599999999999994" height="29" rx="7" class="panel" /><text x="97.5" y="498" class="accent mono" font-size="13" font-weight="500" text-anchor="middle">C++</text><rect x="128.8" y="479" width="71.19999999999999" height="29" rx="7" class="panel" /><text x="164.4" y="498" class="accent mono" font-size="13" font-weight="500" text-anchor="middle">Python</text><rect x="208.0" y="479" width="63.0" height="29" rx="7" class="panel" /><text x="239.5" y="498" class="accent mono" font-size="13" font-weight="500" text-anchor="middle">Shell</text><rect x="279.0" y="479" width="63.0" height="29" rx="7" class="panel" /><text x="310.5" y="498" class="accent mono" font-size="13" font-weight="500" text-anchor="middle">Swift</text><rect x="350.0" y="479" width="63.0" height="29" rx="7" class="panel" /><text x="381.5" y="498" 