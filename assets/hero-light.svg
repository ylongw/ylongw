<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 440" fill="none" role="img" aria-labelledby="title desc">
<title id="title">ylongw — Embedded Engineer · AI Agent Builder</title>
<desc id="desc">Embedded engineer by day, AI tinkerer by night. STM32, Cortex-M and FreeRTOS firmware; AI agents, self-hosted services and media automation.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 H 0 V 24" stroke="#e1eeeb" stroke-width="1"/></pattern>
  <linearGradient id="signal"><stop stop-color="#08785c"/><stop offset="1" stop-color="#096d98"/></linearGradient>
  <clipPath id="card"><rect x="1" y="1" width="998" height="438" rx="22"/></clipPath>
</defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
  .mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
  .background{fill:#f5faf9}.panel{fill:#e8f2f1}.ink{fill:#122e3a}.muted{fill:#4e6b78}.line{fill:#c5dbd9}.accent{fill:#08785c}.blue{fill:#096d98}.amber{fill:#986319}.grid{fill:#e1eeeb}
  .trace{stroke:#08785c;stroke-width:1.5;fill:none}
  .edge{stroke:#c5dbd9;stroke-width:1}
  .flow{stroke-dasharray:8 14;animation:flow 12s linear infinite}
  .cursor{animation:blink 1.8s steps(2,end) infinite}
  @keyframes flow{to{stroke-dashoffset:-220}}
  @keyframes blink{50%{opacity:0.15}}
  @media(prefers-reduced-motion:reduce){.flow,.cursor{animation:none}}
</style>
<rect x="1" y="1" width="998" height="438" rx="22" fill="#f5faf9" stroke="#c5dbd9"/>
<g clip-path="url(#card)"><rect width="1000" height="440" fill="url(#grid)" opacity="0.6"/>
<text x="36" y="38" class="muted mono" font-size="12" font-weight="500" letter-spacing="2">YL / ENGINEERING LOG</text><text x="964" y="38" class="muted mono" font-size="12" font-weight="500" text-anchor="end">01 — IDENTITY</text><path d="M36 54 H964" class="edge"/><text x="35" y="132" class="ink sans" font-size="68" font-weight="750" letter-spacing="-3">ylongw</text><text x="39" y="170" class="accent sans" font-size="23" font-weight="650" >Embedded Engineer · AI Agent Builder</text><text x="39" y="212" class="ink sans" font-size="21" font-weight="500" >Embedded engineer by day,</text><text x="39" y="240" class="ink sans" font-size="21" font-weight="500" >AI tinkerer by night.</text><text x="39" y="280" class="muted sans" font-size="15" font-weight="400" >I build STM32 / Cortex-M / FreeRTOS firmware and tools,</text><text x="39" y="304" class="muted sans" font-size="15" font-weight="400" >and experiment with AI agents, self-hosted services,</text><text x="39" y="328" class="muted sans" font-size="15" font-weight="400" >and media automation on macOS and Linux.</text><rect x="39" y="352" width="87.6" height="29" rx="7" class="panel" /><text x="82.8" y="371" class="accent mono" font-size="13" font-weight="500" text-anchor="middle">FIRMWARE</text><rect x="134.6" y="352" width="71.19999999999999" height="29" rx="7" class="panel" /><text x="170.2" y="371" class="accent mono" font-size="13" font-weight="500" text-anchor="middle">AGENTS</text><rect x="213.79999999999998" y="352" width="104.0" height="29" rx="7" class="panel" /><text x="265.79999999999995" y="371" class="accent mono" font-size="13" font-weight="500" text-anchor="middle">AUTOMATION</text><rect x="630" y="78" width="334" height="302" rx="15" class="panel" stroke="#c5dbd9"/><text x="650" y="106" class="muted mono" font-size="11" font-weight="500" letter-spacing="1.5">SIGNAL / WORKBENCH</text><circle cx="941" cy="102" r="4" class="accent cursor"/><path d="M650 121 H944" class="edge"/><path d="M650 175 H676 L687 155 L700 195 L713 143 L728 175 H751" stroke="url(#signal)" stroke-width="2.5"/><path d="M845 175 H868 V148 H898 V175 H944" stroke="url(#signal)" stroke-width="2.5"/><path d="M650 175 H750 M845 175 H944" class="trace flow"/><rect x="752" y="137" width="92" height="78" rx="9" class="background" /><text x="798" y="169" class="accent mono" font-size="19" font-weight="700" text-anchor="middle">MCU</text><text x="798" y="193" class="muted mono" font-size="10" font-weight="400" text-anchor="middle">CORTEX-M</text><path d="M768 129 V137 M788 129 V137 M808 129 V137 M828 129 V137 M768 215 V223 M788 215 V223 M808 215 V223 M828 215 V223 M744 151 H752 M744 174 H752 M744 197 H752 M844 151 H852 M844 174 H852 M844 197 H852" class="trace"/><path d="M798 224 V242 H650" class="edge"/><text x="650" y="270" class="accent mono" font-size="13" font-weight="500" >$ firmware + agent tools</text><text x="650" y="296" class="muted mono" font-size="13" font-weight="400" >J-Link / RTT / GDB</text><text x="650" y="322" class="muted mono" font-size="13" font-weight="400" >build → flash → inspect</text><text x="650" y="353" class="accent mono" font-size="14" font-weight="500" >$</text><rect x="668" y="340" width="8" height="15" class="accent cursor"/><text x="39" y="413" class="muted mono" font-size="11" font-weight="500" letter-spacing="1.6">FROM BARE METAL TO AGENT LOOPS</text><path d="M650 409 H964" stroke="url(#signal)" stroke-width="2"/>
</g></svg>
